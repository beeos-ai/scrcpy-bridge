name: Mirror scrcpy-bridge image to AWS

on:
  workflow_dispatch:
    inputs:
      production_run_id:
        required: true
      production_run_attempt:
        required: true
        default: "1"

concurrency:
  group: scrcpy-aws-mirror
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  mirror:
    runs-on: [self-hosted, linux, x64, oci, shared-ci]
    environment: production
    timeout-minutes: 20
    steps:
      - name: Fail closed unless explicitly enabled
        env:
          ENABLED: ${{ vars.SCRCPY_AWS_MIRROR_ENABLED }}
        run: test "$ENABLED" = true
      - name: Verify the successful production receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.production_run_id }}
          ATTEMPT: ${{ inputs.production_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ && "$ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > "$RUNNER_TEMP/run.json"
          jq -e --argjson attempt "$ATTEMPT" '.status=="completed" and .conclusion=="success" and .run_attempt==$attempt and .path==".github/workflows/release.yml"' "$RUNNER_TEMP/run.json" >/dev/null
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "scrcpy-production-${RUN_ID}-${ATTEMPT}" --dir "$RUNNER_TEMP/receipt"
          (cd "$RUNNER_TEMP/receipt" && sha256sum -c receipt.sha256)
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Copy exact OCIR digest to ECR without rebuilding
        env:
          OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
          OCIR_AUTH_TOKEN: ${{ secrets.OCIR_AUTH_TOKEN }}
          ECR_REGISTRY: 440744256864.dkr.ecr.ap-southeast-1.amazonaws.com
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/receipt/receipt.json"
          source="$(jq -r .production "$receipt")"
          digest="$(jq -r .digest "$receipt")"
          version="$(jq -r .version "$receipt")"
          echo "::add-mask::$OCIR_AUTH_TOKEN"
          printf '%s' "$OCIR_AUTH_TOKEN" | skopeo login --username "$OCIR_USERNAME" --password-stdin sin.ocir.io
          aws ecr get-login-password --region ap-southeast-1 | skopeo login --username AWS --password-stdin "$ECR_REGISTRY"
          target="${ECR_REGISTRY}/beeos/scrcpy-bridge:${version}"
          skopeo copy --all --preserve-digests --retry-times 3 "docker://${source}" "docker://${target}"
          test "$(skopeo inspect --format '{{.Digest}}' "docker://${target}")" = "$digest"
