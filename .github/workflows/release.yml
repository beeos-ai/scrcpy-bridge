name: release-scrcpy-bridge

on:
  pull_request:
  push:
    tags: ["scrcpy-bridge-v*"]

concurrency:
  group: scrcpy-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_RELEASE_TOOLCHAIN: 1.96.0

jobs:
  linux:
    name: Linux quality and binaries
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, oci, shared-ci, shared-ci-heavy]
    timeout-minutes: 15
    env:
      RUSTUP_HOME: /opt/rustup
      RUSTUP_TOOLCHAIN: 1.96.0-x86_64-unknown-linux-gnu
      RUST_TOOLCHAIN_BIN: /opt/rustup/toolchains/1.96.0-x86_64-unknown-linux-gnu/bin
      RUSTDOC: /opt/rustup/toolchains/1.96.0-x86_64-unknown-linux-gnu/bin/rustdoc
      CROSS_CONFIG: .github/cross-shared-cache.toml
      # Job-level so `cross` inherits the volume passthrough. Step-local
      # `export` in Verify does not apply to Build; 0.1.38 tag builds
      # then hung 30m on docker with sccache Compile requests=0.
      RUSTC_WRAPPER: /usr/local/bin/shared-ci-sccache
      SCCACHE_WRAPPER: /usr/local/bin/shared-ci-sccache
      SCCACHE_BINARY: /usr/local/bin/shared-ci-sccache
      SCCACHE_DIR: /var/lib/shared-ci/organizations/beeos-ai/rust-sccache
      CROSS_CUSTOM_TOOLCHAIN: "1"
      RUSTUP_AUTO_INSTALL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the preinstalled Rust release toolchain
        shell: bash
        run: |
          set -euo pipefail
          # Some shared-ci-heavy slots export sccache paths; others only
          # install the binary. Default to the org wrapper so `set -u`
          # does not fail the PR on a runner that skipped the env file.
          export RUSTC_WRAPPER="${RUSTC_WRAPPER:-/usr/local/bin/shared-ci-sccache}"
          export SCCACHE_WRAPPER="${SCCACHE_WRAPPER:-$RUSTC_WRAPPER}"
          export SCCACHE_BINARY="${SCCACHE_BINARY:-$RUSTC_WRAPPER}"
          export CARGO_HOME="${CARGO_HOME:-/opt/cargo}"
          export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-${CARGO_HOME}/target}"
          export CROSS_CUSTOM_TOOLCHAIN="${CROSS_CUSTOM_TOOLCHAIN:-1}"
          export RUSTUP_AUTO_INSTALL="${RUSTUP_AUTO_INSTALL:-0}"
          export SCCACHE_DIR="${SCCACHE_DIR:-/var/lib/shared-ci/organizations/beeos-ai/rust-sccache}"
          test -n "$CARGO_HOME"
          test -n "$CARGO_TARGET_DIR"
          test "$CROSS_CUSTOM_TOOLCHAIN" = 1
          test "$RUSTUP_AUTO_INSTALL" = 0
          test "$RUSTC_WRAPPER" = /usr/local/bin/shared-ci-sccache
          test -x "$RUSTC_WRAPPER"
          test -x "$SCCACHE_BINARY"
          test "$SCCACHE_WRAPPER" = "$RUSTC_WRAPPER"
          case "$SCCACHE_DIR" in */organizations/beeos-ai/rust-sccache) ;; *) echo "unexpected shared sccache path: $SCCACHE_DIR" >&2; exit 1;; esac
          test "$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)" = "$RUST_RELEASE_TOOLCHAIN"
          rustc --version
          cargo --version
          sccache --version
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            test -d "/opt/rustup/toolchains/${RUST_RELEASE_TOOLCHAIN}-x86_64-unknown-linux-gnu/lib/rustlib/$target" || { echo "runner is missing preinstalled Rust target: $target" >&2; exit 1; }
          done
          test -x /opt/cargo/bin/cross
      - name: Quality gate
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci-cache-contract-test.sh
          # Keep Clippy visible without turning warnings introduced by newer
          # stable toolchains into unrelated release blockers.
          "$RUST_TOOLCHAIN_BIN/cargo" clippy --all-targets --locked
          "$RUST_TOOLCHAIN_BIN/cargo" test --locked
      - name: Report shared Rust compiler cache
        if: always()
        shell: bash
        run: sccache --show-stats

  # Tag Linux `cross` images come from ghcr.io/cross-rs. The OCI
  # shared-ci-heavy slot can compile gnu targets but cannot finish
  # `docker pull` of x86_64-unknown-linux-musl:main (layer
  # cbea91f1666e retries until the job timeout). GitHub-hosted
  # runners pull that registry. Staging still consumes the same
  # scrcpy-linux artifact name.
  linux-dist:
    name: Linux binaries
    if: github.event_name == 'push'
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CROSS_CUSTOM_TOOLCHAIN: "1"
      RUSTUP_AUTO_INSTALL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_RELEASE_TOOLCHAIN }}
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Install cross
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo install -m 0755 cross /usr/local/bin/cross
          cross --version
      - name: Authenticate to GHCR for cross-rs images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build four Linux targets with bounded concurrency
        shell: bash
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            echo "=== cross $target ==="
            cross build --target "$target" --profile dist --locked
          done
      - name: Package Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output/dist-assets release-output/docker-binaries
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            archive="$(scripts/package-target.sh "$target")"
            mv "$archive" "${archive}.sha256" release-output/dist-assets/
          done
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            install -Dm0755 "${CARGO_TARGET_DIR:-target}/${target}/dist/scrcpy-bridge" "release-output/docker-binaries/${target}/scrcpy-bridge"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scrcpy-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-output/
          if-no-files-found: error
          retention-days: 2

  macos:
    name: macOS binaries
    if: github.event_name == 'push'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_RELEASE_TOOLCHAIN }}
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry
            target
          key: scrcpy-macos-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            scrcpy-macos-
      - name: Build and package both macOS targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output/dist-assets
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --target "$target" --profile dist --locked
            archive="$(scripts/package-target.sh "$target")"
            mv "$archive" "${archive}.sha256" release-output/dist-assets/
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scrcpy-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-output/
          if-no-files-found: error
          retention-days: 2

  windows:
    name: Windows binary
    if: github.event_name == 'push'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_RELEASE_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry
            target
          key: scrcpy-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            scrcpy-windows-
      - name: Build and package Windows
        shell: bash
        run: |
          set -euo pipefail
          cargo build --target x86_64-pc-windows-msvc --profile dist --locked
          mkdir -p release-output/dist-assets
          archive="$(scripts/package-target.sh x86_64-pc-windows-msvc)"
          mv "$archive" "${archive}.sha256" release-output/dist-assets/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scrcpy-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-output/
          if-no-files-found: error
          retention-days: 2

  staging:
    name: Publish complete staging candidate
    needs: [linux-dist, macos, windows]
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64, oci, shared-ci, shared-ci-heavy]
    environment: staging
    timeout-minutes: 30
    outputs:
      version: ${{ steps.identity.outputs.version }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
      digest: ${{ steps.publish.outputs.digest }}
    permissions:
      contents: write
    env:
      OCIR_REGISTRY: ${{ vars.OCIR_REGISTRY || 'sin.ocir.io' }}
      OCIR_NAMESPACE: ${{ vars.OCIR_NAMESPACE }}
      OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
      OCIR_AUTH_TOKEN: ${{ secrets.OCIR_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: scrcpy-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scrcpy-input
          merge-multiple: true
      - id: identity
        name: Freeze and verify the complete release set
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#scrcpy-bridge-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          test "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "${version%%-*}"
          scripts/verify-release-assets.sh "$RUNNER_TEMP/scrcpy-input/dist-assets"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: Stage exact musl binaries
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            source="$RUNNER_TEMP/scrcpy-input/docker-binaries/${target}/scrcpy-bridge"
            test -s "$source"
            install -Dm0755 "$source" "dist/${target}/scrcpy-bridge"
            test -x "dist/${target}/scrcpy-bridge"
          done
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker-container
      - name: Authenticate to OCIR
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OCIR_NAMESPACE"
          echo "::add-mask::$OCIR_AUTH_TOKEN"
          printf '%s' "$OCIR_AUTH_TOKEN" | docker login "$OCIR_REGISTRY" --username "$OCIR_USERNAME" --password-stdin
      - id: publish
        name: Build once and publish the OCIR staging authority
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          staging="${OCIR_REGISTRY}/${OCIR_NAMESPACE}/beeos-staging/scrcpy-bridge:${VERSION}-${GITHUB_SHA}"
          metadata="$RUNNER_TEMP/image-metadata.json"
          docker buildx build --platform linux/amd64,linux/arm64 -f Dockerfile.distroless \
            --build-arg "VERSION=$VERSION" --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$staging" --metadata-file "$metadata" --provenance=false \
            --cache-from "type=registry,ref=${OCIR_REGISTRY}/${OCIR_NAMESPACE}/beeos-staging/scrcpy-bridge:buildcache" \
            --cache-to "type=registry,ref=${OCIR_REGISTRY}/${OCIR_NAMESPACE}/beeos-staging/scrcpy-bridge:buildcache,mode=max,ignore-error=true" \
            --push .
          digest="$(jq -er '."containerimage.digest"' "$metadata")"
          test "$(docker buildx imagetools inspect "$staging" --format '{{json .Manifest}}' | jq -er .digest)" = "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          jq -nS --arg commit "$GITHUB_SHA" --arg version "$VERSION" --arg digest "$digest" --arg repository "${OCIR_REGISTRY}/${OCIR_NAMESPACE}/beeos-staging/scrcpy-bridge" \
            '{schemaVersion:1,kind:"scrcpy-bridge-image-manifest",commit:$commit,version:$version,repository:$repository,digest:$digest}' > "$RUNNER_TEMP/image-manifest.json"
      - name: Create a draft GitHub release after all assets and images pass
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.identity.outputs.version }}
          PRERELEASE: ${{ steps.identity.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            jq -e --argjson prerelease "$PRERELEASE" '.isDraft == true and .isPrerelease == $prerelease' "$RUNNER_TEMP/release.json" >/dev/null
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/scrcpy-input/dist-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            args=(--repo "$GITHUB_REPOSITORY" --title "scrcpy-bridge v${VERSION}" --generate-notes --draft)
            [[ "$PRERELEASE" != true ]] || args+=(--prerelease)
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/scrcpy-input/dist-assets/* "${args[@]}"
          fi
      - name: Seal the staging manifest
        shell: bash
        run: (cd "$RUNNER_TEMP" && sha256sum image-manifest.json > image-manifest.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scrcpy-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/image-manifest.json
            ${{ runner.temp }}/image-manifest.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Dispatch the verified staging pin to Backend
        env:
          GH_TOKEN: ${{ secrets.BACKEND_RELEASE_TOKEN }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          VERSION: ${{ steps.identity.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api --method POST repos/beeos-ai/backend/dispatches \
            -f event_type=device-images-pin-promotion \
            -F 'client_payload[component]=scrcpy' \
            -F 'client_payload[channel]=staging' \
            -F "client_payload[runId]=$GITHUB_RUN_ID" \
            -F "client_payload[runAttempt]=$GITHUB_RUN_ATTEMPT" \
            -F "client_payload[commit]=$GITHUB_SHA" \
            -F "client_payload[digest]=$DIGEST" \
            -F "client_payload[version]=$VERSION"

  production:
    name: Promote exact image digest to production
    needs: staging
    runs-on: [self-hosted, linux, x64, oci, shared-ci]
    environment: production
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      OCIR_REGISTRY: ${{ vars.OCIR_REGISTRY || 'sin.ocir.io' }}
      OCIR_NAMESPACE: ${{ vars.OCIR_NAMESPACE }}
      OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
      OCIR_AUTH_TOKEN: ${{ secrets.OCIR_AUTH_TOKEN }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scrcpy-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scrcpy-production
      - name: Copy the verified digest without rebuilding
        env:
          VERSION: ${{ needs.staging.outputs.version }}
          DIGEST: ${{ needs.staging.outputs.digest }}
          PRERELEASE: ${{ needs.staging.outputs.prerelease }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/scrcpy-production" && sha256sum -c image-manifest.sha256)
          manifest="$RUNNER_TEMP/scrcpy-production/image-manifest.json"
          jq -e --arg sha "$GITHUB_SHA" --arg version "$VERSION" --arg digest "$DIGEST" '.schemaVersion==1 and .kind=="scrcpy-bridge-image-manifest" and .commit==$sha and .version==$version and .digest==$digest' "$manifest" >/dev/null
          echo "::add-mask::$OCIR_AUTH_TOKEN"
          printf '%s' "$OCIR_AUTH_TOKEN" | skopeo login --username "$OCIR_USERNAME" --password-stdin "$OCIR_REGISTRY"
          source="$(jq -r .repository "$manifest")@${DIGEST}"
          target="${OCIR_REGISTRY}/${OCIR_NAMESPACE}/beeos/scrcpy-bridge:${VERSION}"
          skopeo copy --all --preserve-digests --retry-times 3 "docker://${source}" "docker://${target}"
          test "$(skopeo inspect --format '{{.Digest}}' "docker://${target}")" = "$DIGEST"
          echo "::add-mask::$GITHUB_TOKEN"
          printf '%s' "$GITHUB_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          skopeo copy --all --preserve-digests --retry-times 3 "docker://${source}" "docker://ghcr.io/beeos-ai/scrcpy-bridge:${VERSION}"
          test "$(skopeo inspect --format '{{.Digest}}' "docker://ghcr.io/beeos-ai/scrcpy-bridge:${VERSION}")" = "$DIGEST"
          if [[ "$PRERELEASE" != true ]]; then
            skopeo copy --all --preserve-digests --retry-times 3 "docker://${source}" "docker://${OCIR_REGISTRY}/${OCIR_NAMESPACE}/beeos/scrcpy-bridge:latest"
            test "$(skopeo inspect --format '{{.Digest}}' "docker://${OCIR_REGISTRY}/${OCIR_NAMESPACE}/beeos/scrcpy-bridge:latest")" = "$DIGEST"
            skopeo copy --all --preserve-digests --retry-times 3 "docker://${source}" "docker://ghcr.io/beeos-ai/scrcpy-bridge:latest"
            test "$(skopeo inspect --format '{{.Digest}}' "docker://ghcr.io/beeos-ai/scrcpy-bridge:latest")" = "$DIGEST"
          fi
      - name: Emit production promotion receipt
        env:
          VERSION: ${{ needs.staging.outputs.version }}
          DIGEST: ${{ needs.staging.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scrcpy-receipt"
          jq -nS --arg commit "$GITHUB_SHA" --arg version "$VERSION" --arg digest "$DIGEST" \
            --arg source "${OCIR_REGISTRY}/${OCIR_NAMESPACE}/beeos-staging/scrcpy-bridge@${DIGEST}" \
            --arg target "${OCIR_REGISTRY}/${OCIR_NAMESPACE}/beeos/scrcpy-bridge@${DIGEST}" \
            '{schemaVersion:1,kind:"scrcpy-bridge-promotion-receipt",commit:$commit,version:$version,digest:$digest,source:$source,production:$target,existingInstancesMutated:false}' \
            > "$RUNNER_TEMP/scrcpy-receipt/receipt.json"
          (cd "$RUNNER_TEMP/scrcpy-receipt" && sha256sum receipt.json > receipt.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scrcpy-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scrcpy-receipt/
          if-no-files-found: error
          retention-days: 90
      - name: Publish the draft GitHub release after production approval
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.staging.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --draft=false)
          [[ "$PRERELEASE" == true ]] || args+=(--latest)
          gh release edit "$GITHUB_REF_NAME" "${args[@]}"
      - name: Dispatch the verified production pin to Backend
        env:
          GH_TOKEN: ${{ secrets.BACKEND_RELEASE_TOKEN }}
          DIGEST: ${{ needs.staging.outputs.digest }}
          VERSION: ${{ needs.staging.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api --method POST repos/beeos-ai/backend/dispatches \
            -f event_type=device-images-pin-promotion \
            -F 'client_payload[component]=scrcpy' \
            -F 'client_payload[channel]=production' \
            -F "client_payload[runId]=$GITHUB_RUN_ID" \
            -F "client_payload[runAttempt]=$GITHUB_RUN_ATTEMPT" \
            -F "client_payload[commit]=$GITHUB_SHA" \
            -F "client_payload[digest]=$DIGEST" \
            -F "client_payload[version]=$VERSION"
