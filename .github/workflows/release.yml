name: release-scrcpy-bridge

# Triggered when a tag like `scrcpy-bridge-v0.1.0` is pushed. Produces:
#   1. Static per-target archives uploaded to the GitHub release as
#      download assets. Consumed by `@beeos-ai/cli` when users run
#      `beeos device attach`.
#   2. A multi-arch Docker image, pushed to GHCR. Consumed by the ReDroid
#      Pod sidecar. The image is built from GHA *artifacts* (musl binaries
#      from the matrix job), NOT by re-downloading release assets from the
#      public GitHub CDN inside `docker build` (that path is flaky under
#      multi-arch buildx / qemu).
#
# Tag format conventions:
#   - `scrcpy-bridge-v0.1.0`        -> stable release (updates `:latest`)
#   - `scrcpy-bridge-v0.1.0-rc.1`   -> prerelease (does NOT update `:latest`,
#                                      GH release marked prerelease)
#   - `scrcpy-bridge-v0.1.0-staging.1` -> same prerelease semantics, for
#                                         staging-only validation
#
# Any semver-style pre-release suffix (a `-` after the version) flips the
# release into prerelease mode so staging consumers can pin to the specific
# `:<version>` tag via `SCRCPY_BRIDGE_IMAGE` without affecting production
# ReDroid Pods that track `:latest`.
#
# See Cargo.toml `[package.metadata.dist]` for the list of targets.
on:
  push:
    tags:
      - "scrcpy-bridge-v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      prerelease: ${{ steps.derive.outputs.prerelease }}
    steps:
      - id: derive
        run: |
          tag="${GITHUB_REF_NAME#scrcpy-bridge-v}"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  binaries:
    name: binaries (${{ matrix.target }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,   runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu,  runner: ubuntu-22.04, cross: true }
          - { target: x86_64-unknown-linux-musl,  runner: ubuntu-22.04, cross: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-22.04, cross: true }
          # x86_64 macs are cross-compiled on a macos-14 (Apple Silicon)
          # runner. macos-13 (Intel) runners are heavily oversubscribed
          # in the GitHub-hosted pool and frequently take 30+ minutes
          # to allocate; cross-compiling from arm to x86 on darwin works
          # natively because Xcode ships both SDKs, and dtolnay's action
          # installs the rustup target via `targets:` below.
          - { target: x86_64-apple-darwin,        runner: macos-14 }
          - { target: aarch64-apple-darwin,       runner: macos-14 }
          - { target: x86_64-pc-windows-msvc,     runner: windows-2022 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux only)
        if: matrix.cross == true
        run: cargo install cross --locked

      # Note: --release is the alias for --profile release; cargo 1.95+
      # rejects combining it with an explicit --profile <other>. The
      # `dist` profile defined in Cargo.toml already implies release-grade
      # optimization, so we drop --release.
      - name: Build (native)
        if: matrix.cross != true
        working-directory: .
        run: cargo build --target ${{ matrix.target }} --profile dist --locked

      - name: Build (cross)
        if: matrix.cross == true
        working-directory: .
        run: cross build --target ${{ matrix.target }} --profile dist --locked

      - name: Package archive
        id: pack
        shell: bash
        # Archive name is intentionally version-less so the BeeOS CLI can
        # fetch it at a stable URL:
        #   /releases/latest/download/scrcpy-bridge-<target>.tar.gz
        # GitHub redirects `latest/download` to whichever tag is marked
        # "latest" in the repo's Releases page. See
        # web/packages/core/src/sidecars/cargo-dist.ts (archiveName +
        # releaseBaseUrl).
        run: |
          bin="scrcpy-bridge"
          if [[ "${{ matrix.target }}" == *windows* ]]; then bin="scrcpy-bridge.exe"; fi
          stage="scrcpy-bridge-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/dist/${bin}" "$stage/"
          cp README.md LICENSE 2>/dev/null "$stage/" || true
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "${stage}.zip" "$stage"
            archive="${stage}.zip"
          else
            tar -czf "${stage}.tar.gz" "$stage"
            archive="${stage}.tar.gz"
          fi
          # Publish SHA256 sidecar alongside the archive — the CLI
          # validates archive integrity against this digest (see
          # cargo-dist.ts). Missing digest is a soft warning for
          # back-compat but we always ship it in prod releases to
          # catch truncated downloads / CDN tampering.
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$archive" | awk '{print $1"  "$2}' > "${archive}.sha256"
          else
            sha256sum "$archive" | awk '{print $1"  "$2}' > "${archive}.sha256"
          fi
          echo "asset=$archive"            >> "$GITHUB_OUTPUT"
          echo "digest=${archive}.sha256"  >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.pack.outputs.asset }}
            ${{ steps.pack.outputs.digest }}
          fail_on_unmatched_files: true
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}

      # Musl binaries are also uploaded as GHA artifacts so the docker job
      # can COPY them into the image without re-downloading from the public
      # GitHub Release CDN (that path is flaky under multi-arch buildx).
      - name: Upload musl binary for docker
        if: contains(matrix.target, 'linux-musl')
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: scrcpy-bridge-${{ matrix.target }}/scrcpy-bridge
          if-no-files-found: error
          retention-days: 2

  docker:
    name: distroless docker image
    # Publish GHCR even if a non-musl matrix cell fails (e.g. Windows).
    # Docker only consumes the two linux-musl artifacts from `binaries`.
    needs: [plan, binaries]
    if: ${{ always() && needs.plan.result == 'success' && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pull the musl binaries produced by the matrix job over GHA's
      # internal artifact store (authenticated, same-org, no CDN hop).
      - name: Download musl binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*-unknown-linux-musl
          path: _musl_artifacts
          merge-multiple: false

      - name: Stage musl binaries for docker context
        shell: bash
        run: |
          set -euo pipefail
          # download-artifact layout:
          #   _musl_artifacts/binary-x86_64-unknown-linux-musl/scrcpy-bridge
          #   _musl_artifacts/binary-aarch64-unknown-linux-musl/scrcpy-bridge
          # Dockerfile expects:
          #   dist/<triple>/scrcpy-bridge
          for triple in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            src="_musl_artifacts/binary-${triple}/scrcpy-bridge"
            if [[ ! -f "$src" ]]; then
              echo "missing $src — musl matrix cell failed or artifact name drifted" >&2
              find _musl_artifacts -type f 2>/dev/null || true
              exit 1
            fi
            mkdir -p "dist/${triple}"
            install -m 0755 "$src" "dist/${triple}/scrcpy-bridge"
            ls -la "dist/${triple}/scrcpy-bridge"
            file "dist/${triple}/scrcpy-bridge" || true
          done

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: imgtags
        shell: bash
        run: |
          ver="${{ needs.plan.outputs.version }}"
          {
            echo "tags<<EOF"
            echo "ghcr.io/beeos-ai/scrcpy-bridge:${ver}"
            if [[ "${{ needs.plan.outputs.prerelease }}" != "true" ]]; then
              echo "ghcr.io/beeos-ai/scrcpy-bridge:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.distroless
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.imgtags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.plan.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ReDroid sidecars run on OKE and can only pull OCIR. GHCR remains the
      # public/self-host artifact; copy the same digest into OCIR so Runtime
      # can pin sin.ocir.io/...@sha256:... without a manual crane step.
      - name: Copy image to OCIR
        if: ${{ vars.OCIR_REGISTRY != '' && secrets.OCIR_AUTH_TOKEN != '' }}
        env:
          VER: ${{ needs.plan.outputs.version }}
          OCIR_REGISTRY: ${{ vars.OCIR_REGISTRY || 'sin.ocir.io' }}
          OCIR_NAMESPACE: ${{ vars.OCIR_NAMESPACE }}
          OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
          OCIR_AUTH_TOKEN: ${{ secrets.OCIR_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$OCIR_NAMESPACE"
          echo "::add-mask::$OCIR_AUTH_TOKEN"
          printf '%s' "$OCIR_AUTH_TOKEN" | docker login "$OCIR_REGISTRY" --username "$OCIR_USERNAME" --password-stdin
          src="ghcr.io/beeos-ai/scrcpy-bridge:${VER}"
          digest="$(docker buildx imagetools inspect "$src" --format '{{json .Manifest}}' | jq -er '.digest')"
          for repo in beeos/scrcpy-bridge beeos-staging/scrcpy-bridge; do
            dst="${OCIR_REGISTRY}/${OCIR_NAMESPACE}/${repo}:${VER}"
            docker buildx imagetools create --tag "$dst" "${src}@${digest}"
            copied="$(docker buildx imagetools inspect "$dst" --format '{{json .Manifest}}' | jq -er '.digest')"
            test "$copied" = "$digest"
            echo "copied ${dst}@${copied}"
          done
