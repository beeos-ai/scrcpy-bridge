name: English only

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cjk-check:
    name: No CJK text outside the allowlist
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check
        run: python3 scripts/cjk_check.py
